name: ezim_mobile
description: EZIM (Enterprise Inventory & Management System) mobile app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0

  # WebView
  webview_flutter: ^4.10.0

  # State Management
  provider: ^6.0.0

  # UI
  google_fonts: ^6.1.0

  # Utility
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
